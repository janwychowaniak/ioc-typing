[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ioc-typing"
version = "0.1.0"
requires-python = ">=3.10"
description = "A Python library for identifying and classifying Indicators of Compromise (IOCs)"
readme = "README.md"
authors = [{ name = "Jan Wychowaniak", email = "43786923+janwychowaniak@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["security", "ioc", "classifier", "cyber-security"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
    "tox",
]

[project.urls]
Homepage = "https://github.com/janwychowaniak/ioc-typing"

[tool.hatch.build.targets.wheel]
packages = ["src/ioc_typing"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

