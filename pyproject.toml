[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ioc-typing"
version = "0.1.0"
requires-python = ">=3.10"
description = "A Python library for identifying and classifying Indicators of Compromise (IOCs)"
readme = "README.md"
authors = [{ name = "Jan Wychowaniak", email = "43786923+janwychowaniak@users.noreply.github.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["security", "ioc", "classifier", "cyber-security"]
dependencies = []

[project.urls]
Homepage = "https://github.com/janwychowaniak/ioc-typing"

[tool.hatch.build.targets.wheel]
packages = ["src/ioc_typing"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.envs.default.scripts]
test = "pytest -v --cov=src {args:tests}"
lint = [
    "ruff check src tests",
    "ruff format --check src tests",
]
format = [
    "ruff format src tests",
    "ruff check --fix src tests",
]
typecheck = "mypy src tests"
check = [
    "lint",
    "typecheck",
    "test",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
