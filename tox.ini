[tox]
envlist = py310
isolated_build = True

[testenv]
deps =
    .[dev]
usedevelop = true
commands =
    pytest -v --cov=src {posargs:tests}

[testenv:lint]
deps =
    .[dev]
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:format]
deps =
    .[dev]
commands =
    ruff format src tests
    ruff check --fix src tests

[testenv:typecheck]
deps =
    .[dev]
commands =
    mypy src tests

[testenv:build]
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*

[testenv:clean]
deps =
skip_install = true
allowlist_externals =
    rm
    find
commands =
    rm -rfv build/ dist/ .eggs/ .pytest_cache/ .ruff_cache/ .mypy_cache/ .coverage
    rm -r .tox/
    find . -type d -name "*.egg-info" -exec rm -rfv \{\} +
    find . -type d -name "__pycache__" -exec rm -rfv \{\} +

[testenv:clean-all]
deps =
skip_install = true
allowlist_externals =
    rm
    find
commands =
    rm -r .venv/
    rm -rfv build/ dist/ .eggs/ .pytest_cache/ .ruff_cache/ .mypy_cache/ .coverage
    rm -r .tox/
    find . -type d -name "*.egg-info" -exec rm -rfv \{\} +
    find . -type d -name "__pycache__" -exec rm -rfv \{\} +

[testenv:dev]
deps = .[dev]
commands =
usedevelop = true
envdir = .venv
